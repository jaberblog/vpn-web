name: vless_vpn
description: Vira VPN - VLESS VPN app (Flutter + flutter_vless) with an HTML/CSS/JS interface.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_vless: ^1.1.7
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.3
  http: ^1.2.2
  permission_handler: ^12.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/www/
    - assets/www/css/
    - assets/www/js/
    - assets/www/fonts/
